<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
     <title>Curriculum Vitae</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
     <div class="contenedor">
        <div class="cabecera">
              <div class="titulo">
                CURRICULUM VITAE
            </div>

            <div class="foto">
                <img src="imagen.jpg" alt="Foto del postulante">
            </div>

        </div>

        <form>

            <fieldset>
                <legend>DATOS PERSONALES</legend>
                <div class="fila">
                    <div class="grupo">
                        <label>Apellidos</label>
                        <input type="text">
                    </div>

                    <div class="grupo">
                        <label>Nombre</label>
                        <input type="text">
                    </div>
                </div>

                <div class="fila">

                    <div class="grupo">
                        <label>DNI</label>
                        <input type="text">
                    </div>
                    
                    <div class="grupo">
                        <label>Lugar</label>
                        <input type="text">
                    </div>

                </div>

                <div class="fila">

                    <div class="grupo">
                        <label>Fecha de Nacimiento</label>
                        <input type="date">
                    </div>

                    <div class="grupo">
                        <label>Provincia</label>
                        <input type="text">
                    </div>

                </div>

                <div class="fila">
                    <div class="grupo">
                        <label>Dirección</label>
                        <input type="text">
                    </div>

                    <div class="grupo">
                        <label>Localidad</label>
                        <input type="text">
                    </div>

                </div>

                <div class="fila">
                    <div class="grupo">
                        <label>Teléfono</label>
                        <input type="tel">
                    </div>

                    <div class="grupo">
                        <label>Teléfono Móvil</label>
                        <input type="tel">
                    </div>

                </div>

                <div class="fila">

                    <div class="grupo">
                        <label>E-mail</label>
                        <input type="email">
                    </div>

                </div>

            </fieldset>

            <fieldset>

                <legend>FORMACIÓN Y ESTUDIOS</legend>

                <label>Titulación</label>
                <input type="text">

                <br><br>

                <label>Idiomas</label>
                <input type="text">

                <br><br>

                <label>Conocimientos Informáticos</label>
                <input type="text">

                <br><br>

                <label>Cursos y Seminarios</label>

                <textarea rows="4"></textarea>

            </fieldset>

            <fieldset>

                <legend>EXPERIENCIA PROFESIONAL</legend>

                <label>Empresa</label>
                <input type="text">

                <br><br>

                <label>Fecha</label>

                <input type="month">

                <br><br>

                <label>Puesto / Actividad desarrollada</label>

                <textarea rows="4"></textarea>

            </fieldset>

            <fieldset>

                <legend>DATOS COMPLEMENTARIOS</legend>

                <textarea rows="5"></textarea>

            </fieldset>

            <div class="pie">

                <p>
                    Todo lo expuesto anteriormente podrá ser acreditado,
                    en caso de solicitud.
                </p>

                <label>Lugar y Fecha</label>

                <input type="text">

            </div>

        </form>

    </div>

</body>

</html>
